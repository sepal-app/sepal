# Scrypt parameters for the test suite only. See
# bases/app/test/sepal/app/password_hashing_test.clj for what a real install
# uses and what keeps these two from being confused.
#
# The suite hashes 529 times. At the production work factor that is 217 seconds
# of a 364-second run. These parameters cost 2 ms a hash instead of 323 ms.
global.salt.length=64
hash.scrypt.workfactor=16
hash.scrypt.resources=1
hash.scrypt.parallelization=1
hash.scrypt.derivedKeyLength=64
