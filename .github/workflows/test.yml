name: Pull Request

on:
  pull_request:
  push:
    branches:
      - "master"

env:
  CLOJURE_VERSION: '1.12.0.1479'
  JAVA_VERSION: '25'
  NODE_VERSION: '22'
  # Native builds of the two linters that have one. Keep these in step with the
  # :clj-kondo and :cljfmt aliases in deps.edn, which are the fallback for
  # anyone running bin/lint without the binaries on PATH — the two would
  # otherwise drift and CI would fail on a rule nobody has locally.
  CLJ_KONDO_VERSION: '2026.08.04'
  CLJFMT_VERSION: '0.16.5'

jobs:
  # Its own job because linting has nothing to do with the schema matrix. It ran
  # inside it, so both legs spent 38 seconds linting the same files, on each
  # leg's critical path. Here it runs once, beside them.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No SpatiaLite: none of the three linters opens a database.

      # For poly check, which is the only one still on the JVM.
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Clojure
        uses: DeLaGuardo/setup-clojure@master
        with:
          cli: ${{ env.CLOJURE_VERSION }}
          # bin/lint prefers a binary on PATH and falls back to `clojure -M:...`.
          # It was falling back here, and starting a JVM costs more than the
          # linting: clj-kondo is 18.6s that way against 3.1s native, cljfmt
          # 10.9s against 5.0s.
          clj-kondo: ${{ env.CLJ_KONDO_VERSION }}
          cljfmt: ${{ env.CLJFMT_VERSION }}

      # A key of its own. Sharing one with build would let whichever job
      # finished first save a cache holding only its own dependencies, and the
      # other would take the hit on every later run.
      - name: Cache Clojure Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.clojure
            ~/.cpcache
          key: ${{ runner.os }}-clojure-lint-${{ hashFiles('**/deps.edn') }}

      - name: Prepare Dependencies
        run: clojure -P -M:poly

      - name: Lint
        run: bin/lint

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        schema: [ 'latest', 'floor' ]
    steps:
      - uses: actions/checkout@v4

      - name: Install SpatiaLite
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-mod-spatialite

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Clojure
        uses: DeLaGuardo/setup-clojure@master
        with:
          cli: ${{ env.CLOJURE_VERSION }}

      - name: Cache Clojure Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.clojure
            ~/.cpcache
          key: ${{ runner.os }}-clojure-${{ hashFiles('**/deps.edn') }}

      - name: Prepare Dependencies
        run: clojure -P -M:dev:test:test-runner

      - name: Run Unit Tests (schema ${{ matrix.schema }})
        env:
          SEPAL_TEST_SCHEMA_VERSION: ${{ matrix.schema }}
        run: clojure -M:dev:test:test-runner --focus :unit

  e2e-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        browser: [ 'chromium' ]
    steps:
      - uses: actions/checkout@v4

      - name: Install SpatiaLite
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-mod-spatialite

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Clojure
        uses: DeLaGuardo/setup-clojure@master
        with:
          cli: ${{ env.CLOJURE_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'bases/app/package-lock.json'

      - name: Cache Clojure Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.clojure
            ~/.cpcache
          key: ${{ runner.os }}-clojure-${{ hashFiles('**/deps.edn') }}

      - name: Prepare Clojure Dependencies
        run: clojure -P -M:dev:test:test-e2e:test-runner

      - name: Build Frontend Assets
        run: |
          cd bases/app
          npm ci
          npm run build

      - name: Cache Playwright Browser (${{ matrix.browser }})
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.50.0-${{ matrix.browser }}

      - name: Install Playwright Browser (${{ matrix.browser }})
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          java -cp "$(clojure -Spath -M:test-e2e)" com.microsoft.playwright.CLI install --with-deps ${{ matrix.browser }}

      - name: Install Playwright System Dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: |
          java -cp "$(clojure -Spath -M:test-e2e)" com.microsoft.playwright.CLI install-deps ${{ matrix.browser }}

      - name: Run E2E Tests (${{ matrix.browser }})
        run: PLAYWRIGHT_BROWSER=${{ matrix.browser }} clojure -M:dev:test:test-e2e:test-runner --focus :e2e

  docker:
    runs-on: ubuntu-latest
    # lint is named here because it used to be a step inside build, so a lint
    # failure blocked the image. Splitting it out without this would have let a
    # push to master publish an image that does not lint.
    needs: [lint, build, e2e-tests]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: projects/app/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
