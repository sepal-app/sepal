name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: Check CLA signature
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        # contributor-assistant/github-action is archived upstream and receives no
        # further updates. It is pinned to the commit tagged v2.6.1; the repository
        # is read-only, so that commit cannot change.
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          branch: 'master'
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/sepal-app/sepal/blob/master/CLA.md'
          allowlist: brettatoms,*[bot]
          custom-notsigned-prcomment: |
            Thanks for your pull request. Before it can be merged, please sign the
            [Contributor License Agreement](https://github.com/sepal-app/sepal/blob/master/CLA.md).
            [CONTRIBUTING.md](https://github.com/sepal-app/sepal/blob/master/CONTRIBUTING.md)
            explains why it exists — in short, Sepal stays AGPL-3.0 and you keep your
            copyright, but Sepal LLC needs the right to also offer commercial licenses
            to institutions that cannot accept the AGPL.

            To sign, post a comment on this pull request containing exactly:
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All contributors have signed the CLA. Thank you!'
